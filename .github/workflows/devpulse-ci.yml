
name: DevPulse CI

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish DevPulse
    runs-on: windows-latest

    # Supersede in-flight builds for the same ref. Because `deploy` needs this
    # job, a cancelled build means its deployment never starts at all.
    # PR builds use refs/pull/<n>/merge, so separate PRs never cancel each other.
    concurrency:
      group: devpulse-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "DevPulse.slnx"

      - name: Build
        run: dotnet build "DevPulse.slnx" --configuration Release --no-restore

      - name: Publish server project
        run: dotnet publish "src/DevPulse.Server/DevPulse.Server.csproj" --configuration Release --no-restore --output "${{ github.workspace }}\publish"

      - name: Verify publish output
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "publish"

          foreach ($file in @("DevPulse.Server.dll", "web.config", "appsettings.json")) {
            if (-not (Test-Path (Join-Path $publishPath $file))) {
              throw "Required publish file is missing: $file"
            }
          }

          Write-Host "Publish output verified."

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: devpulse-publish
          path: publish/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy DevPulse to IIS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: [self-hosted, Windows, X64, devpulse-deploy]
    timeout-minutes: 20

    # Serialize deployments without making PR builds compete for this lock.
    # cancel-in-progress stays false so a deployment is never interrupted after
    # the site has been taken offline. GitHub still drops superseded *pending*
    # deployments by default (queue is single), so only the newest one waits.
    concurrency:
      group: deploy-devpulse
      cancel-in-progress: false

    steps:
      # Skip the whole deployment when a newer commit has already landed on
      # production. Runs that were cancelled as builds never reach this point;
      # this guards the remaining race windows.
      - name: Check this commit is still the latest on production
        id: freshness
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'production',
            });

            const isLatest = data.sha === context.sha;
            core.setOutput('current', isLatest);

            if (isLatest) {
              core.info(`This run (${context.sha}) is the latest commit on production.`);
            } else {
              core.notice(`A newer commit (${data.sha}) is already on production. Skipping this deployment.`);
            }

      - name: Clean deployment workspace
        if: steps.freshness.outputs.current == 'true'
        shell: powershell
        run: |
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "deploy-publish"

          if (Test-Path -LiteralPath $publishPath) {
            Remove-Item -LiteralPath $publishPath -Recurse -Force
          }

      - name: Download CI artifact
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: devpulse-publish
          path: deploy-publish

      - name: Back up SQL Server database
        if: steps.freshness.outputs.current == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sqlServer = "."
          $databaseName = "DevPulse"

          $dbBackupRoot = "C:\SQLBackups\DevPulse"

          if ($sqlServer -like "REPLACE_*" -or $databaseName -like "REPLACE_*") {
            throw "Configure the SQL Server instance and database name before deployment."
          }

          if (-not (Test-Path -LiteralPath $dbBackupRoot -PathType Container)) {
            throw "Database backup directory does not exist: $dbBackupRoot"
          }

          $backupFile = Join-Path $dbBackupRoot (
            "DevPulse-DB-" + (Get-Date -Format "yyyyMMdd-HHmmss-fff") + ".bak"
          )

          $quotedDatabaseName = "[" + $databaseName.Replace("]", "]]") + "]"
          $escapedBackupFile = $backupFile.Replace("'", "''")

          # This connects to the master database so the workflow can execute BACKUP DATABASE against DevPulse
          $connectionString = "Server=$sqlServer;Database=master;Integrated Security=SSPI;Encrypt=True;TrustServerCertificate=True;Connection Timeout=30;"
          
          $connection = New-Object System.Data.SqlClient.SqlConnection($connectionString)

          try {
            $connection.Open()

            # Create a full copy-only backup before deploying the application.
            $command = $connection.CreateCommand()
            $command.CommandTimeout = 0
            $command.CommandText = @"
          BACKUP DATABASE $quotedDatabaseName
          TO DISK = N'$escapedBackupFile'
          WITH COPY_ONLY, CHECKSUM, INIT, STATS = 10;
          "@
            [void]$command.ExecuteNonQuery()
            $command.Dispose()

            if (-not (Test-Path -LiteralPath $backupFile -PathType Leaf)) {
              throw "SQL Server reported success, but the backup file is missing."
            }

            if ((Get-Item -LiteralPath $backupFile).Length -le 0) {
              throw "Database backup file is empty."
            }

            Write-Host "Database backup created: $backupFile"
          }
          finally {
            if ($connection.State -ne [System.Data.ConnectionState]::Closed) {
              $connection.Close()
            }
            $connection.Dispose()
          }

          # Retain the two newest database backup files.
          $backups = @(
            Get-ChildItem -LiteralPath $dbBackupRoot -Filter "DevPulse-DB-*.bak" -File |
              Sort-Object LastWriteTimeUtc -Descending
          )

          foreach ($oldBackup in @($backups | Select-Object -Skip 2)) {
            Remove-Item -LiteralPath $oldBackup.FullName -Force
            Write-Host "Removed old database backup: $($oldBackup.Name)"
          }

      - name: Deploy, health check, and rollback
        if: steps.freshness.outputs.current == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $sitePath = "C:\inetpub\analytics"
          $backupRoot = "C:\inetpub\DevPulseBackups"
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "deploy-publish"
          $offlineFile = Join-Path $sitePath "app_offline.htm"
          $backupPath = Join-Path $backupRoot (Get-Date -Format "yyyyMMdd-HHmmss-fff")

          # Validate paths and required files before changing the live application.
          if (-not (Test-Path -LiteralPath $sitePath -PathType Container)) {
            throw "IIS application directory not found."
          }

          if (-not (Test-Path -LiteralPath $backupRoot -PathType Container)) {
            throw "Application backup directory not found."
          }

          foreach ($file in @("DevPulse.Server.dll", "web.config", "appsettings.json")) {
            if (-not (Test-Path (Join-Path $publishPath $file))) {
              throw "Published application file is missing: $file"
            }
          }

          if (-not (Test-Path (Join-Path $sitePath "DevPulse.Server.dll"))) {
            throw "Existing live application not found. Deployment cancelled."
          }

          # Back up all existing application files, including appsettings.
          New-Item -ItemType Directory -Path $backupPath -Force | Out-Null

          robocopy $sitePath $backupPath /E /COPY:DAT /R:1 /W:1 /XF app_offline.htm
          $backupExitCode = $LASTEXITCODE

          if ($backupExitCode -ge 8 -or
              -not (Test-Path (Join-Path $backupPath "DevPulse.Server.dll"))) {
            throw "Application backup failed or is incomplete. Deployment cancelled."
          }

          Write-Host "Application backup created: $backupPath"

          # Re-check freshness immediately before taking the site offline. This
          # covers the case where this deployment had already started when a
          # newer commit landed: the site stays online instead of bouncing to a
          # build that is already obsolete.
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = "application/vnd.github+json"
          }

          $latestSha = $null

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $response = Invoke-RestMethod `
                -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/production" `
                -Headers $headers `
                -TimeoutSec 30

              $latestSha = $response.sha
              break
            }
            catch {
              Write-Host "Freshness re-check attempt $attempt failed: $($_.Exception.Message)"

              if ($attempt -lt 3) {
                Start-Sleep -Seconds 5
              }
            }
          }

          if (-not $latestSha) {
            throw "Unable to determine the latest commit on production during the freshness re-check."
          }

          if ($latestSha -ne $env:GITHUB_SHA) {
            Write-Host "A newer commit ($latestSha) is already on production. Skipping this deployment before taking the site offline."
            return
          }

          try {
            # Take the application offline before deleting or replacing files.
            Set-Content -LiteralPath $offlineFile `
              -Value "DevPulse deployment in progress." -Encoding UTF8

            Start-Sleep -Seconds 10

            # Remove all old files and directories, retaining the offline marker.
            Get-ChildItem -LiteralPath $sitePath -Force |
              Where-Object { $_.Name -ne "app_offline.htm" } |
              Remove-Item -Recurse -Force

            # Copy the complete artifact, including appsettings*.json.
            robocopy $publishPath $sitePath /E /COPY:DAT /R:2 /W:2
            $copyExitCode = $LASTEXITCODE

            if ($copyExitCode -ge 8) {
              throw "Deployment file copy failed."
            }

            foreach ($file in @("DevPulse.Server.dll", "web.config", "appsettings.json")) {
              if (-not (Test-Path (Join-Path $sitePath $file))) {
                throw "Deployed application file is missing: $file"
              }
            }

            # Bring the new version online.
            Remove-Item -LiteralPath $offlineFile -Force

            # Check the public website.
            $healthUrl = "https://devpulse.datavancedbd.xyz"
            $healthy = $false

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $response = Invoke-WebRequest `
                  -Uri $healthUrl `
                  -UseBasicParsing `
                  -TimeoutSec 30

                if ([int]$response.StatusCode -ge 200 -and
                    [int]$response.StatusCode -lt 400) {
                  $healthy = $true
                  Write-Host "Health check passed on attempt $attempt."
                  break
                }
              }
              catch {
                Write-Host "Health check attempt $attempt failed: $($_.Exception.Message)"
              }

              if ($attempt -lt 3) {
                Start-Sleep -Seconds 10
              }
            }

            if (-not $healthy) {
              throw "Website health check failed after 3 attempts."
            }

            Write-Host "Deployment successful. HTTP $([int]$response.StatusCode)"
            $global:LASTEXITCODE = 0
          }
          catch {
            $deploymentError = $_.Exception.Message
            Write-Host "Deployment failed: $deploymentError"
            Write-Host "Restoring application backup: $backupPath"

            # Keep the application offline during rollback.
            Set-Content -LiteralPath $offlineFile `
              -Value "DevPulse rollback in progress." -Encoding UTF8

            # Restore old files and remove files introduced by the failed release.
            robocopy $backupPath $sitePath /MIR /COPY:DAT /R:2 /W:2 /XF app_offline.htm
            $rollbackExitCode = $LASTEXITCODE

            if ($rollbackExitCode -ge 8) {
              throw "ROLLBACK FAILED. The application has been left offline. Backup: $backupPath"
            }

            Remove-Item -LiteralPath $offlineFile -Force

            throw "Deployment failed; previous application files restored. Reason: $deploymentError"
          }

      - name: Clean up old application backups
        if: success() && steps.freshness.outputs.current == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $backupRoot = "C:\inetpub\DevPulseBackups"

          $backups = @(
            Get-ChildItem -LiteralPath $backupRoot -Directory |
              Sort-Object LastWriteTimeUtc -Descending
          )

          foreach ($oldBackup in @($backups | Select-Object -Skip 5)) {
            Remove-Item -LiteralPath $oldBackup.FullName -Recurse -Force
            Write-Host "Removed old application backup: $($oldBackup.Name)"
          }
