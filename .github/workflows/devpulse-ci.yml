
name: DevPulse CI

on:
  push:
    branches:
      - feature/ci_cd_test_branch_rifat
  pull_request:
    branches:
      - feature/ci_cd_test_branch_rifat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-devpulse
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish DevPulse
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "DevPulse.slnx"

      - name: Build
        run: dotnet build "DevPulse.slnx" --configuration Release --no-restore

      - name: Publish server project
        run: dotnet publish "src/DevPulse.Server/DevPulse.Server.csproj" --configuration Release --no-restore --output "${{ github.workspace }}\publish"

      - name: Remove appsettings files from publish output
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "publish"

          Get-ChildItem -Path $publishPath -Recurse -File |
            Where-Object { $_.Name -like "appsettings*.json" } |
            Remove-Item -Force

      - name: Verify publish output
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "publish"

          if (-not (Test-Path (Join-Path $publishPath "DevPulse.Server.dll"))) {
            throw "DevPulse.Server.dll was not found in the publish output."
          }

          $settingsFiles = Get-ChildItem -Path $publishPath -Recurse -File |
            Where-Object { $_.Name -like "appsettings*.json" }

          if ($settingsFiles) {
            throw "appsettings files were found in the publish output."
          }

          Write-Host "Publish output verified. No appsettings files included."

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: devpulse-publish
          path: publish/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy DevPulse to IIS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/ci_cd_test_branch_rifat'
    runs-on: [self-hosted, Windows, X64, devpulse-deploy]
    timeout-minutes: 15

    steps:
      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: devpulse-publish
          path: deploy-publish

      - name: Deploy, health check, and rollback
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $sitePath = "C:\inetpub\analytics"
          $backupRoot = "C:\inetpub\DevPulseBackups"
          $publishPath = Join-Path $env:GITHUB_WORKSPACE "deploy-publish"
          $offlineFile = Join-Path $sitePath "app_offline.htm"
          $backupPath = Join-Path $backupRoot (Get-Date -Format "yyyyMMdd-HHmmss")

          # Validate deployment files.
          if (-not (Test-Path (Join-Path $sitePath "DevPulse.Server.dll"))) {
            throw "Existing live application not found. Deployment cancelled."
          }

          if (-not (Test-Path (Join-Path $publishPath "DevPulse.Server.dll"))) {
            throw "Published application DLL is missing."
          }

          if (-not (Test-Path (Join-Path $publishPath "web.config"))) {
            throw "Published web.config is missing."
          }

          if (Get-ChildItem $publishPath -Recurse -File |
              Where-Object { $_.Name -like "appsettings*.json" }) {
            throw "Artifact contains appsettings files. Deployment cancelled."
          }

          # Back up the live application before changing anything.
          New-Item -ItemType Directory -Path $backupPath -Force | Out-Null

          robocopy $sitePath $backupPath /E /COPY:DAT /R:1 /W:1 /XF app_offline.htm
          $backupExitCode = $LASTEXITCODE

          if ($backupExitCode -ge 8 -or
              -not (Test-Path (Join-Path $backupPath "DevPulse.Server.dll"))) {
            throw "Backup failed or is incomplete. Deployment cancelled."
          }

          Write-Host "Backup created: $backupPath"

          try {
            # Take the application offline before replacing files.
            Set-Content -Path $offlineFile `
              -Value "DevPulse deployment in progress." -Encoding UTF8

            Start-Sleep -Seconds 10

            # Preserve production appsettings files.
            robocopy $publishPath $sitePath /E /XF appsettings*.json /R:2 /W:2
            $copyExitCode = $LASTEXITCODE

            if ($copyExitCode -ge 8) {
              throw "Deployment file copy failed. Starting rollback."
            }

            # Bring the new version online.
            Remove-Item -LiteralPath $offlineFile -Force

            # Check the public website.
            $healthUrl = "https://devpulse.datavancedbd.xyz"
            $healthy = $false

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                $response = Invoke-WebRequest `
                  -Uri $healthUrl `
                  -UseBasicParsing `
                  -TimeoutSec 30

                if ([int]$response.StatusCode -ge 200 -and
                    [int]$response.StatusCode -lt 400) {
                  $healthy = $true
                  Write-Host "Health check passed on attempt $attempt."
                  break
                }
              }
              catch {
                Write-Host "Health check attempt $attempt failed: $($_.Exception.Message)"
              }

              if ($attempt -lt 3) {
                Start-Sleep -Seconds 10
              }
            }

            if (-not $healthy) {
              throw "Website health check failed after 3 attempts."
            }

            Write-Host "Deployment successful. HTTP $([int]$response.StatusCode)"
          }
          catch {
            $deploymentError = $_.Exception.Message
            Write-Host "Deployment failed: $deploymentError"
            Write-Host "Restoring backup: $backupPath"

            # Keep the application offline during rollback.
            Set-Content -Path $offlineFile `
              -Value "DevPulse rollback in progress." -Encoding UTF8

            # Restore the previous files and remove newly deployed files.
            robocopy $backupPath $sitePath /MIR /COPY:DAT /R:2 /W:2 /XF app_offline.htm
            $rollbackExitCode = $LASTEXITCODE

            if ($rollbackExitCode -ge 8) {
              throw "ROLLBACK FAILED. The application has been left offline. Backup: $backupPath"
            }

            Remove-Item -LiteralPath $offlineFile -Force

            throw "Deployment failed; previous files restored. Reason: $deploymentError"
          }


      - name: Clean up old backups
        shell: powershell
        run: |
          $backupRoot = "C:\inetpub\DevPulseBackups"

          $backups = @(
            Get-ChildItem -Path $backupRoot -Directory |
              Sort-Object LastWriteTime -Descending
          )

          # Keep the 5 most recent backups.
          $oldBackups = $backups | Select-Object -Skip 5

          foreach ($backup in $oldBackups) {
            Remove-Item -LiteralPath $backup.FullName -Recurse -Force
            Write-Host "Removed old backup: $($backup.Name)"
          }

